[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmi-interfaces"
dynamic = ["version"]
description = "Generate FMI 2.0 CoSimulation artifacts from a parser-free interface Reduction."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "pyssp contributors" }
]
# The FMI XML library is a direct URL, not an index lookup: it is an immutable
# release asset attached by its wheels workflow. The tag is v<version>, and an
# unreleased tag makes this wheel uninstallable. SysML ingestion lives in
# ``pyfmi_sysml``; this package has no parser dependency.
dependencies = [
  "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.4.dev0/experimental_pyssp_standard-0.9.4.dev0-py3-none-any.whl"
]

[project.optional-dependencies]
dev = [
  "fmpy",
  "pytest",
  "ruff"
]

[project.scripts]
pyfmi = "pyfmi_interfaces.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pyfmi_interfaces = ["fmi2_headers/*.h"]

[tool.setuptools.dynamic]
version = { attr = "pyfmi_interfaces.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyfmi_interfaces*", "pyfmi_sysml2*"]

[tool.ruff]
# Lint selection is explicit so a ruff upgrade cannot change the gate.
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "static: inspects source or files without executing the package",
  "unit: one object's behaviour, no generated artifact",
  "component: a generated artifact is the unit under test",
  "contract: two directions must agree (round-trip, sync)",
  "system: the CLI is driven end to end",
  "slow: not part of the default CI subset",
]
